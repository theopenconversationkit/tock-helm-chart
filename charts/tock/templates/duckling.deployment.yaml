apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}-duckling'
  labels:
    app.kubernetes.io/name: duckling
    app.kubernetes.io/component: duckling
    app.kubernetes.io/part-of: tock
    app.kubernetes.io/version: {{ .Chart.Version }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.duckling.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: duckling
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/resource: deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/component: duckling
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/resource: deployment
      annotations:
        {{- with .Values.duckling.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
    spec:
      {{- include "duckling.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.duckling.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.duckling.podSecurityContext "enabled" | toYaml | nindent 10 }}
      {{- end }}
      {{- with .Values.duckling.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.duckling.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.duckling.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.duckling.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.duckling.truststore.enabled }}
      initContainers:
        - name: truststore-generator
          image: {{ include "truststoreContainer.image" . }}
          imagePullPolicy: {{ .Values.global.truststoreContainerImage.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.global.truststoreContainerImage.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.global.truststoreContainerImage.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              csplit -f /tmp/corp- -b '%02d.pem' /etc/ssl/certs/{{ .Values.duckling.truststore.certSecret }}.crt '/-----BEGIN CERTIFICATE-----/' '{*}' >/dev/null || true
              i=0
              for f in /tmp/corp-*.pem; do
                [ -s "$f" ] || continue
                keytool -importcert -noprompt \
                 -file "$f" \
                 -alias "corp-$i" \
                 -keystore /truststore/cacerts \
                 -storepass changeit
                i=$((i+1))
              done
              keytool -list -keystore /truststore/cacerts -storepass changeit | grep -i corp || true
              chmod 0444 /truststore/cacerts
          volumeMounts:
            - name: cert-volume
              mountPath: /etc/ssl/certs/{{ .Values.duckling.truststore.certSecret }}.crt
              subPath: {{ .Values.duckling.truststore.certSecret }}.crt
              readOnly: true
            - name: truststore-volume
              mountPath: /truststore
      {{- if .Values.duckling.resources }}
          resources: {{- toYaml .Values.duckling.resources | nindent 12 }}
      {{- end }}
      {{- end }}
      containers:
        - name: duckling
          image: {{ include "duckling.image" . }}
          imagePullPolicy: {{ .Values.duckling.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.duckling.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.duckling.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          ports:
            - name: duckling
              containerPort: 8080
          {{- if .Values.duckling.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.duckling.startupProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.duckling.startupProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.duckling.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.duckling.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 180
            timeoutSeconds: 5 # Defaults to 1
            periodSeconds: 20 # Defaults to 10
            failureThreshold: 3 # Defaults to 3
          volumeMounts:
              - mountPath: /tmp
                name: tmp-volume
          {{- if .Values.duckling.truststore.enabled }}
              - mountPath: /truststore
                name: truststore-volume
          {{- end }}
              {{- with .Values.duckling.extraVolumeMounts }}
{{ toYaml . | indent 14 }}
              {{- end }}
          {{- with .Values.duckling.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: '{{ .Release.Name }}-duckling-cfg'
      {{- if .Values.duckling.resources }}
          resources: {{- toYaml .Values.duckling.resources | nindent 14 }}
      {{- end }}
      volumes:
          - name: tmp-volume
            emptyDir: {}
          {{- if .Values.duckling.truststore.enabled }}
          - name: cert-volume
            secret:
              secretName: {{ .Values.duckling.truststore.certSecret }}
          - name: truststore-volume
            emptyDir: {}
          {{- end }}
          {{- with .Values.duckling.extraVolumes }}
{{ toYaml . | indent 10 }}
          {{- end }}
    {{- with .Values.duckling.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.duckling.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.duckling.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}