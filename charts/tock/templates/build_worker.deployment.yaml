apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}-build-worker'
  labels:
    app.kubernetes.io/name:  build-worker
    app.kubernetes.io/component:  build-worker
    app.kubernetes.io/part-of: tock
    app.kubernetes.io/version: {{ .Chart.Version }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: build-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/resource: deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/component: build-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/resource: deployment
      annotations:
        {{- with .Values.buildWorker.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
    spec:
      {{- include "buildWorker.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.buildWorker.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.buildWorker.podSecurityContext "enabled" | toYaml | nindent 10 }}
      {{- end }}
      {{- with .Values.buildWorker.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.buildWorker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.buildWorker.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.buildWorker.terminationGracePeriodSeconds }}
      {{- end }}
      initContainers:
        - name: check-mongo
          image: {{ include "initContainer.image" . }}
          imagePullPolicy: {{ .Values.global.initContainerImage.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.global.initContainerImage.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.global.initContainerImage.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |-
              OK=0
              echo "Checking mongo port"
              while [ $OK != 1 ]; do
                  echo -n "."
                  nc -z {{ template "url.mongo.isup" . }} 27017 2>&1 >/dev/null && OK=1 || sleep 1
              done
              echo
              echo "Done"
      {{- if .Values.buildWorker.resources }}
          resources: {{- toYaml .Values.buildWorker.resources | nindent 12 }}
      {{- end }}               
      {{- if .Values.buildWorker.truststore.enabled }}
        - name: truststore-generator
          image: {{ include "truststoreContainer.image" . }}
          imagePullPolicy: {{ .Values.global.truststoreContainerImage.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.global.truststoreContainerImage.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.global.truststoreContainerImage.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              csplit -f /tmp/corp- -b '%02d.pem' /etc/ssl/certs/{{ .Values.buildWorker.truststore.certSecret }}.crt '/-----BEGIN CERTIFICATE-----/' '{*}' >/dev/null || true
              i=0
              for f in /tmp/corp-*.pem; do
                [ -s "$f" ] || continue
                keytool -importcert -noprompt \
                 -file "$f" \
                 -alias "corp-$i" \
                 -keystore /truststore/cacerts \
                 -storepass changeit
                i=$((i+1))
              done
              keytool -list -keystore /truststore/cacerts -storepass changeit | grep -i corp || true
              chmod 0444 /truststore/cacerts
          volumeMounts:
            - name: cert-volume
              mountPath: /etc/ssl/certs/{{ .Values.buildWorker.truststore.certSecret }}.crt
              subPath: {{ .Values.buildWorker.truststore.certSecret }}.crt
              readOnly: true
            - name: truststore-volume
              mountPath: /truststore
      {{- if .Values.buildWorker.resources }}
          resources: {{- toYaml .Values.buildWorker.resources | nindent 12 }}
      {{- end }}
      {{- end }}
      containers:
        - name: build-worker
          image: {{ include "buildWorker.image" . }}
          imagePullPolicy: {{ .Values.buildWorker.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.buildWorker.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.buildWorker.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.buildWorker.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.buildWorker.startupProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.buildWorker.startupProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.buildWorker.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.buildWorker.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 180
            timeoutSeconds: 10 # Defaults to 1
            periodSeconds: 30 # Defaults to 10
            failureThreshold: 3 # Defaults to 3
          volumeMounts:
              - mountPath: /tmp
                name: tmp-volume
          {{- if .Values.buildWorker.truststore.enabled }}
              - mountPath: /truststore
                name: truststore-volume
          {{- end }}
              {{- with .Values.buildWorker.extraVolumeMounts }}
{{ toYaml . | indent 14 }}
              {{- end }}
          {{- with .Values.buildWorker.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: '{{ .Release.Name }}-build-worker-cfg'
      {{- if .Values.buildWorker.resources }}
          resources: {{- toYaml .Values.buildWorker.resources | nindent 14 }}
      {{- end }}
      volumes:
          - name: tmp-volume
            emptyDir: {}
          {{- if .Values.buildWorker.truststore.enabled }}
          - name: cert-volume
            secret:
              secretName: {{ .Values.buildWorker.truststore.certSecret }}
          - name: truststore-volume
            emptyDir: {}
          {{- end }}
          {{- with .Values.buildWorker.extraVolumes }}
{{ toYaml . | indent 10 }}
          {{- end }}
    {{- with .Values.buildWorker.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.buildWorker.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.buildWorker.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}